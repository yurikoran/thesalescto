<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2d2d4e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- TSC monogram -->
  <text x="256" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="180" font-weight="800" fill="white" letter-spacing="-8">TSC</text>
  <!-- Accent line -->
  <rect x="128" y="260" width="256" height="4" rx="2" fill="#3b82f6"/>
  <!-- Subtitle -->
  <text x="256" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="600" fill="#3b82f6" letter-spacing="12">SALES CTO</text>
</svg>
