<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2d2d4e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Accent bar top -->
  <rect x="0" y="0" width="1200" height="6" fill="#3b82f6"/>
  <!-- Left content area -->
  <text x="80" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white">The Sales CTO</text>
  <!-- Accent line -->
  <rect x="80" y="200" width="200" height="4" rx="2" fill="#3b82f6"/>
  <!-- Tagline -->
  <text x="80" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#94a3b8">Your Embedded Partner in</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#94a3b8">Turning Technology Into Revenue</text>
  <!-- Stats -->
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#3b82f6">80% Win Rate</text>
  <text x="350" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="white"> · </text>
  <text x="390" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#3b82f6">5x Growth</text>
  <text x="580" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="white"> · </text>
  <text x="620" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#3b82f6">10+ Countries</text>
  <!-- URL -->
  <text x="80" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#64748b">thesalescto.com</text>
  <!-- Accent bar bottom -->
  <rect x="0" y="624" width="1200" height="6" fill="#3b82f6"/>
</svg>
